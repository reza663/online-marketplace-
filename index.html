<!doctype html>
<html lang="bn">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#f4f7f5;
  color:#17352b;
  padding-bottom:72px
}

header{
  position:sticky;
  top:0;
  z-index:50;
  background:#087f5b;
  color:#fff;
  padding:12px 14px;
  box-shadow:0 2px 10px #0002
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px
}

.logo{
  font-size:23px;
  font-weight:800
}

.header-actions{
  display:flex;
  gap:7px
}

.hbtn{
  border:0;
  background:#fff;
  color:#087f5b;
  border-radius:20px;
  padding:7px 11px;
  font-weight:bold
}

.search{
  margin-top:10px
}

.search input{
  width:100%;
  padding:12px 14px;
  border:0;
  border-radius:12px;
  outline:0;
  font-size:15px
}

nav{
  position:sticky;
  top:111px;
  z-index:40;
  background:#fff;
  display:flex;
  overflow:auto;
  gap:8px;
  padding:9px;
  border-bottom:1px solid #ddd
}

nav button{
  border:1px solid #cfe4da;
  background:#fff;
  color:#176047;
  padding:8px 13px;
  border-radius:20px;
  white-space:nowrap
}

nav button.active{
  background:#087f5b;
  color:#fff
}

main{
  padding:14px;
  max-width:1100px;
  margin:auto
}

.page-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px
}

.page-title h2{
  margin:0;
  font-size:21px
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px
}

.card{
  background:#fff;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 3px 12px #00000012
}

.product-img{
  width:100%;
  height:180px;
  object-fit:contain;
  display:block;
  background:#f7faf8;
  padding:8px
}

.card-body{
  padding:11px
}

.card h3{
  margin:0 0 5px;
  font-size:16px
}

.cat,.small{
  font-size:12px;
  color:#6b7d76
}

.cat{
  margin-bottom:6px
}

.price{
  color:#087f5b;
  font-size:18px;
  font-weight:800
}

.card-actions{
  display:flex;
  gap:6px;
  margin-top:9px
}

button{
  cursor:pointer
}

.primary{
  background:#087f5b;
  color:#fff;
  border:0;
  border-radius:9px;
  padding:9px 12px;
  font-weight:bold
}

.secondary{
  background:#e9f5f0;
  color:#087f5b;
  border:0;
  border-radius:9px;
  padding:9px 12px;
  font-weight:bold
}

.danger{
  background:#ffe9e9;
  color:#b42318;
  border:0;
  border-radius:9px;
  padding:8px 11px;
  font-weight:bold
}

.full{
  width:100%
}

.section{
  background:#fff;
  padding:14px;
  border-radius:15px;
  margin-bottom:13px;
  box-shadow:0 2px 10px #0000000d
}

.section h3{
  margin-top:0
}

input,select,textarea{
  width:100%;
  padding:11px;
  border:1px solid #ccd9d3;
  border-radius:9px;
  margin:5px 0 9px;
  font-size:15px;
  outline:0
}

textarea{
  min-height:80px;
  resize:vertical
}

.product-row,
.order-row{
  border:1px solid #e0e8e4;
  border-radius:12px;
  padding:11px;
  margin-bottom:9px;
  background:#fbfdfc
}

.row-flex{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px
}

.qty{
  display:flex;
  align-items:center;
  gap:9px
}

.qty button{
  width:32px;
  height:32px;
  border:0;
  border-radius:8px;
  background:#e7f4ee;
  color:#087f5b;
  font-size:18px;
  font-weight:bold
}

.empty{
  text-align:center;
  padding:35px 10px;
  color:#71817b
}

.profile-icon{
  font-size:48px;
  text-align:center
}

.stat-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px
}

.stat{
  background:#eaf6f1;
  border-radius:12px;
  padding:14px;
  text-align:center
}

.stat b{
  display:block;
  font-size:22px;
  color:#087f5b
}

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  background:#fff;
  border-top:1px solid #ddd;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  z-index:60
}

.bottom button{
  border:0;
  background:#fff;
  padding:8px 2px;
  color:#52645d;
  font-size:11px
}

.bottom button.active{
  color:#087f5b;
  font-weight:bold
}

.bottom span{
  display:block;
  font-size:20px
}

footer{
  padding:20px 10px;
  text-align:center;
  color:#71817b;
  font-size:11px
}

.badge{
  display:inline-block;
  background:#e8f6f0;
  color:#087f5b;
  border-radius:20px;
  padding:5px 9px;
  font-size:12px;
  font-weight:bold
}

.payment-box{
  background:#f1faf6;
  border:1px solid #cce9dc;
  border-radius:12px;
  padding:12px;
  margin-top:8px
}

.chips{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin:6px 0 10px
}

.chip{
  border:1px solid #cfe4da;
  background:#fff;
  color:#176047;
  border-radius:20px;
  padding:7px 10px
}

.chip.active{
  background:#087f5b;
  color:#fff
}

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  z-index:100;
  display:none;
  align-items:flex-end
}

.modal.show{
  display:flex
}

.sheet{
  background:#fff;
  width:100%;
  max-height:92vh;
  overflow:auto;
  border-radius:20px 20px 0 0;
  padding:16px
}

.sheet img{
  width:100%;
  height:230px;
  object-fit:contain;
  background:#f6faf8;
  border-radius:14px
}

.variant-title{
  font-weight:bold;
  margin:10px 0 5px
}

.variant{
  border:1px solid #d5e2dc;
  background:#fff;
  border-radius:10px;
  padding:10px;
  margin:7px 0;
  display:flex;
  justify-content:space-between;
  gap:8px
}

.variant.selected{
  border:2px solid #087f5b;
  background:#edf9f4
}

.close{
  background:#eee;
  border:0;
  border-radius:50%;
  width:35px;
  height:35px;
  font-size:18px
}

.notice{
  padding:11px;
  border-radius:10px;
  background:#fff8df;
  border:1px solid #f0df9c;
  margin-bottom:10px;
  font-size:13px
}

.status{
  display:inline-block;
  padding:5px 9px;
  border-radius:15px;
  background:#e8f6f0;
  color:#087f5b;
  font-size:12px;
  font-weight:bold
}

@media(min-width:700px){
  .grid{
    grid-template-columns:repeat(4,1fr)
  }

  .product-img{
    height:190px
  }

  .sheet{
    max-width:650px;
    margin:auto;
    border-radius:20px 20px 0 0
  }
}

@media(max-width:360px){
  .grid{
    gap:8px
  }

  .product-img{
    height:150px
  }

function productImage(p){

  let sub="শুধু পণ্যের ছবি";

  if(p.cat==="ফ্যাশন") sub="মানুষ ছাড়া পণ্যের ছবি";
  if(p.cat==="সফট ড্রিঙ্কস") sub="পরিষ্কার বোতল/ক্যান";
  if(p.cat==="পানীয়") sub="পরিষ্কার মিনারেল ওয়াটার বোতল";
  if(p.cat==="খাবার") sub="পরিষ্কার খাবারের ছবি";

  return svgData(p.type,p.name,sub);
}

   ========================================================= */

function filteredProducts(){

  const q=(document.getElementById("searchInput")?.value || "")
    .trim()
    .toLowerCase();

  return products.filter(p=>{

    const categoryOK=
      currentCategory==="সব" ||
      p.cat===currentCategory;

    const text=(p.name+" "+p.en+" "+p.cat).toLowerCase();

    return categoryOK && (!q || text.includes(q));
  });
}

/* =========================================================
   CART
   ========================================================= */

function saveCart(){

  localStorage.setItem(
    "ekshathe_cart",
    JSON.stringify(cart)
  );

  updateCartCount();
}

function quickAdd(id){

  const p=products.find(x=>x.id===id);

  addToCart(p,0);

  alert("পণ্যটি কার্টে যোগ হয়েছে।");
}

function addSelectedToCart(){

  if(!selectedProduct)return;

  addToCart(
    selectedProduct,
    selectedVariant
  );

  closeModal();

  alert("পণ্যটি কার্টে যোগ হয়েছে।");
}

function addToCart(p,variantIndex){

  const variant=p.variants[variantIndex];

  const key=p.id+"-"+variantIndex;

  const existing=
    cart.find(x=>x.key===key);

  if(existing){

    existing.qty++;

  }else{

    cart.push({
      key:key,
      productId:p.id,
      variantIndex:variantIndex,
      name:p.name,
      variant:variant[0],
      price:variant[1],
      qty:1
    });

  }

  saveCart();
}

function updateCartCount(){

  const count=
    cart.reduce((sum,x)=>sum+x.qty,0);

  document.getElementById("cartCount").textContent=count;
}

function cartTotal(){

  return cart.reduce(
    (sum,x)=>sum+(x.price*x.qty),
    0
  );
}

function changeQty(key,delta){

  const item=
    cart.find(x=>x.key===key);

  if(!item)return;

  item.qty+=delta;

  if(item.qty<=0){

    cart=
      cart.filter(x=>x.key!==key);
  }

  saveCart();

  renderCart();
}

function placeOrder(){

  const name=
    document.getElementById("customerName").value.trim();

  const phone=
    document.getElementById("customerPhone").value.trim();

  const address=
    document.getElementById("customerAddress").value.trim();

  const payment=
    document.getElementById("paymentMethod").value;

  if(!name || !phone || !address){

    alert("নাম, মোবাইল এবং ঠিকানা পূরণ করুন।");
    return;
  }

  const order={
    id:"EK"+Date.now(),
    date:new Date().toLocaleString("bn-BD"),
    customer:{
      name:name,
      phone:phone,
      address:address
    },
    payment:payment,
    items:[...cart],
    total:cartTotal(),
    status:"অর্ডার গ্রহণ করা হয়েছে"
  };

  orders.unshift(order);

  localStorage.setItem(
    "ekshathe_orders",
    JSON.stringify(orders)
  );

  cart=[];

  saveCart();

  alert(
    "অর্ডার সফলভাবে গ্রহণ করা হয়েছে।\nঅর্ডার নম্বর: "+order.id

  showPage("orders");
}

/* =========================================================
   ADMIN PANEL
   ========================================================= */

function renderAdmin(){

  document.getElementById("app").innerHTML=`

    <div class="section">

      <h2>⚙️ Admin Panel</h2>

      <div class="stat-grid">

        <div class="stat">
          <b>${products.length}</b>
          পণ্য
        </div>

        <div class="stat">
          <b>${orders.length}</b>
          অর্ডার
        </div>

        <div class="stat">
          <b>৳${orders.reduce((s,o)=>s+o.total,0)}</b>
          বিক্রি
        </div>

        <div class="stat">
          <b>${cart.length}</b>
          কার্ট
        </div>

      </div>

    </div>

    <div class="section">

      <h3>অর্ডার ম্যানেজমেন্ট</h3>

      ${
        orders.length
        ?
        orders.map(o=>`

          <div class="order-row">

            <div class="row-flex">

              <b>${o.id}</b>

              <select
                onchange="updateOrderStatus('${o.id}',this.value)">

                <option
                  ${o.status==="অর্ডার গ্রহণ করা হয়েছে"?"selected":""}>
                  অর্ডার গ্রহণ করা হয়েছে
                </option>

                <option
                  ${o.status==="প্রস্তুত হচ্ছে"?"selected":""}>
                  প্রস্তুত হচ্ছে
                </option>

                <option
                  ${o.status==="ডেলিভারির পথে"?"selected":""}>
                  ডেলিভারির পথে
                </option>

                <option
                  ${o.status==="ডেলিভারি সম্পন্ন"?"selected":""}>
                  ডেলিভারি সম্পন্ন
                </option>

                <option
                  ${o.status==="বাতিল"?"selected":""}>
                  বাতিল
                </option>

              </select>

            </div>

            <div class="small">
              ${o.customer.name} —
              ${o.customer.phone}
            </div>

          </div>

        `).join("")
        :
        `<div class="empty">কোনো অর্ডার নেই।</div>`
      }

    </div>

    <div class="section">

      <h3>পেমেন্ট নম্বর</h3>

      <input
        id="adminBkash"
        value="${PAYMENT.bkash}"
        placeholder="বিকাশ">

      <input
        id="adminNagad"
        value="${PAYMENT.nagad}"
        placeholder="নগদ">

      <input
        id="adminRocket"
        value="${PAYMENT.rocket}"
        placeholder="রকেট">

      <button
        class="primary full"
        onclick="savePaymentNumbers()">
        💾 পেমেন্ট নম্বর সেভ
      </button>

    </div>

  `;
}

function updateOrderStatus(id,status){

  const order=
    orders.find(o=>o.id===id);

  if(!order)return;

  order.status=status;

  localStorage.setItem(
    "ekshathe_orders",
    JSON.stringify(orders)
  );

  alert("অর্ডারের স্ট্যাটাস আপডেট হয়েছে।");
}

function savePaymentNumbers(){

  PAYMENT.bkash=
    document.getElementById("adminBkash").value;

  PAYMENT.nagad=
    document.getElementById("adminNagad").value;

  PAYMENT.rocket=
    document.getElementById("adminRocket").value;

  localStorage.setItem(
    "ekshathe_payment",
    JSON.stringify(PAYMENT)
  );

  alert("পেমেন্ট নম্বর সেভ হয়েছে।");
}

/* =========================================================
   PAGE ROUTER
   ========================================================= */

function showPage(page){

  currentPage=page;

  if(page==="home"){
    renderHome();
  }

  else if(page==="shop"){
    renderProducts();
  }

  else if(page==="cart"){
    renderCart();
  }

  else if(page==="checkout"){
    renderCheckout();
  }

  else if(page==="orders"){
    renderOrders();
  }

  else if(page==="profile"){
    renderProfile();
  }

  else if(page==="seller"){
    renderSeller();
  }

  else if(page==="admin"){
    renderAdmin();
  }

  updateNav();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

/* =========================================================
   NAV ACTIVE
   ========================================================= */

function updateNav(){

  document.querySelectorAll(".bottom button")
    .forEach(b=>b.classList.remove("active"));

  const map={
    home:"navHome",
    shop:"navShop",
    cart:"navCart",
    orders:"navOrders",
    profile:"navProfile"
  };

  if(map[currentPage]){
    document
      .getElementById(map[currentPage])
      .classList.add("active");
  }
}

/* =========================================================
   LANGUAGE
   ========================================================= */

function toggleLanguage(){

  language=
    language==="bn"
      ?"en"
      :"bn";

  renderProducts();
}

/* =========================================================
   LOAD SAVED DATA
   ========================================================= */

function loadSavedData(){

  const savedPayment=
    JSON.parse(
      localStorage.getItem("ekshathe_payment") || "null"
    );

  if(savedPayment){

    PAYMENT.bkash=savedPayment.bkash;
    PAYMENT.nagad=savedPayment.nagad;
    PAYMENT.rocket=savedPayment.rocket;
  }

  const profile=
    JSON.parse(
      localStorage.getItem("ekshathe_profile") || "null"
    );

  if(profile){

    window.savedProfile=profile;
  }
}

/* =========================================================
   INITIALIZE
   ========================================================= */

loadSavedData();

renderCategories();

updateCartCount();

showPage("home");

</script>
