<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>একসাথে — Seller & Admin MVP</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7f5;
  color:#17352b;
}
header{
  background:#087f5b;
  color:white;
  padding:14px;
  position:sticky;
  top:0;
  z-index:10;
}
.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.logo{
  font-size:22px;
  font-weight:bold;
}
.cart-btn{
  background:white;
  color:#087f5b;
  border:0;
  border-radius:20px;
  padding:8px 14px;
  font-weight:bold;
}
.search{
  width:100%;
  padding:11px;
  margin-top:10px;
  border:0;
  border-radius:10px;
  font-size:15px;
}
nav{
  display:flex;
  overflow:auto;
  gap:7px;
  padding:10px;
  background:white;
  border-bottom:1px solid #ddd;
}
nav button{
  border:0;
  background:#e8f5ef;
  color:#087f5b;
  padding:8px 12px;
  border-radius:20px;
  white-space:nowrap;
}
main{
  padding:12px;
  padding-bottom:80px;
}
.section-title{
  font-size:20px;
  font-weight:bold;
  margin:8px 0 12px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}
.card{
  background:white;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 2px 8px #00000012;
}
.product-img{
  width:100%;
  height:150px;
  object-fit:cover;
  display:block;
  background:#eef3f0;
}
.fallback-img{
  width:100%;
  height:150px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#eaf4ef;
  font-size:55px;
}
.card-body{
  padding:10px;
}
.card h3{
  margin:0 0 6px;
  font-size:16px;
}
.category{
  font-size:12px;
  color:#777;
}
.price{
  color:#087f5b;
  font-weight:bold;
  font-size:18px;
  margin:7px 0;
}
button{
  cursor:pointer;
}
.primary{
  width:100%;
  border:0;
  background:#087f5b;
  color:white;
  padding:10px;
  border-radius:9px;
  font-weight:bold;
}
.danger{
  background:#c92a2a;
  color:white;
  border:0;
  padding:8px 10px;
  border-radius:8px;
}
.box{
  background:white;
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
  box-shadow:0 2px 8px #00000010;
}
input,select,textarea{
  width:100%;
  padding:11px;
  margin:6px 0;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:15px;
}
.item{
  display:flex;
  gap:10px;
  align-items:center;
  border-bottom:1px solid #eee;
  padding:10px 0;
}
.item:last-child{
  border-bottom:0;
}
.item img{
  width:65px;
  height:65px;
  object-fit:cover;
  border-radius:10px;
}
.item-info{
  flex:1;
}
.qty{
  display:flex;
  align-items:center;
  gap:7px;
}
.qty button{
  border:0;
  background:#e8f5ef;
  color:#087f5b;
  width:28px;
  height:28px;
  border-radius:7px;
  font-weight:bold;
}
.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  padding:8px;
  z-index:20;
}
.bottom button{
  border:0;
  background:none;
  color:#555;
  font-size:12px;
}
.bottom span{
  display:block;
  font-size:20px;
}
.hidden{
  display:none!important;
}
.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:15px;
  background:#e8f5ef;
  color:#087f5b;
  font-size:12px;
}
.total{
  font-size:20px;
  font-weight:bold;
  color:#087f5b;
}
.empty{
  text-align:center;
  padding:30px 10px;
  color:#777;
}
.notice{
  background:#fff3cd;
  color:#664d03;
  padding:10px;
  border-radius:10px;
  margin-bottom:12px;
  font-size:13px;
}
@media(min-width:700px){
  .grid{
    grid-template-columns:repeat(4,1fr);
  }
  main{
    max-width:1100px;
    margin:auto;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-row">
    <div class="logo">একসাথে</div>
    <button class="cart-btn" onclick="show('cart')">
      🛒 কার্ট (<span id="cartCount">0</span>)
    </button>
  </div>

  <input
    id="search"
    class="search"
    placeholder="পণ্য খুঁজুন..."
    oninput="render()"
  >
</header>

<nav>
  <button onclick="filterCat('সব')">সব</button>
  <button onclick="filterCat('ফ্যাশন')">ফ্যাশন</button>
  <button onclick="filterCat('ইলেকট্রনিক্স')">ইলেকট্রনিক্স</button>
  <button onclick="filterCat('হোম')">হোম</button>
  <button onclick="filterCat('খাবার')">খাবার</button>
</nav>

<main>

  <section id="home">
    <div class="section-title">জনপ্রিয় পণ্য</div>
    <div id="products" class="grid"></div>
  </section>

  <section id="cart" class="hidden">
    <div class="section-title">🛒 আমার কার্ট</div>
    <div id="cartList"></div>
    <div id="cartTotal"></div>
  </section>

  <section id="orders" class="hidden">
    <div class="section-title">📦 আমার অর্ডার</div>
    <div id="ordersList"></div>
  </section>

  <section id="profile" class="hidden">
    <div class="section-title">👤 প্রোফাইল</div>

    <div class="box">
      <h3>আমার তথ্য</h3>
      <input id="profileName" placeholder="আপনার নাম">
      <input id="profilePhone" placeholder="মোবাইল নম্বর">
      <textarea id="profileAddress" placeholder="ঠিকানা"></textarea>
      <button class="primary" onclick="saveProfile()">সেভ করুন</button>
    </div>

    <div class="box">
      <h3>একসাথে</h3>
      <p>অনলাইন কেনাকাটার সহজ প্ল্যাটফর্ম।</p>
    </div>
  </section>

  <section id="seller" class="hidden">
    <div class="section-title">🏪 Seller Panel</div>

    <div class="box">
      <h3>নতুন পণ্য যোগ করুন</h3>

      <input id="pn" placeholder="পণ্যের নাম">

      <select id="pc">
        <option>ফ্যাশন</option>
        <option>ইলেকট্রনিক্স</option>
        <option>হোম</option>
        <option>খাবার</option>
      </select>

      <input id="pp" type="number" placeholder="দাম">

      <input id="pi" placeholder="ছবির URL (ঐচ্ছিক)">

      <button class="primary" onclick="addProduct()">
        পণ্য যোগ করুন
      </button>
    </div>

    <div class="box">
      <h3>আমার পণ্য</h3>
      <div id="sellerProducts"></div>
    </div>
  </section>

  <section id="admin" class="hidden">
    <div class="section-title">⚙️ Admin Panel</div>

    <div class="notice">
      এখানে অর্ডার দেখা ও পণ্যের তথ্য পরিচালনা করা যাবে।
    </div>

    <div class="box">
      <h3>সব অর্ডার</h3>
      <div id="adminOrders"></div>
    </div>

    <div class="box">
      <h3>পণ্য তালিকা</h3>
      <div id="adminProducts"></div>
    </div>
  </section>

</main>

<div class="bottom">
  <button onclick="show('home')">
    <span>🏠</span>হোম
  </button>

  <button onclick="show('cart')">
    <span>🛒</span>কার্ট
  </button>

  <button onclick="show('orders')">
    <span>📦</span>অর্ডার
  </button>

  <button onclick="show('profile')">
    <span>👤</span>প্রোফাইল
  </button>

  <button onclick="show('seller')">
    <span>🏪</span>Seller
  </button>

  <button onclick="show('admin')">
    <span>⚙️</span>Admin
  </button>
</div>

<script>

const starter = [

  {
    id:1,
    n:'পুরুষের শার্ট',
    c:'ফ্যাশন',
    p:850,
    i:'https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?auto=format&fit=crop&w=500&q=70'
  },

  {
    id:2,
    n:'মহিলাদের ড্রেস',
    c:'ফ্যাশন',
    p:1250,
    i:'https://images.unsplash.com/photo-1595777457583-95e059d581b8?auto=format&fit=crop&w=500&q=70'
  },

  {
    id:3,
    n:'স্মার্ট ওয়াচ',
    c:'ইলেকট্রনিক্স',
    p:3000,
    i:'https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=70'
  },

  {
    id:4,
    n:'ব্যাকপ্যাক',
    c:'ফ্যাশন',
    p:900,
    i:'https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=500&q=70'
  },

  {
    id:5,
    n:'টেবিল ল্যাম্প',
    c:'হোম',
    p:700,
    i:'https://images.unsplash.com/photo-1507473885765-e6ed057f782c?auto=format&fit=crop&w=500&q=70'
  },

  {
    id:6,
    n:'স্পোর্টস জুতা',
    c:'ফ্যাশন',
    p:1300,
    i:'https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=500&q=70'
  },

  {
    id:7,
    n:'কাচ্চি বিরিয়ানি',
    c:'খাবার',
    p:300,
    i:'https://images.unsplash.com/photo-1589302168068-964664d93dc0?auto=format&fit=crop&w=500&q=80'
  },

  {
    id:8,
    n:'চিকেন বার্গার',
    c:'খাবার',
    p:180,
    i:'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=500&q=70'
  },

  {
    id:9,
    n:'পিজ্জা',
    c:'খাবার',
    p:280,
    i:'https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=500&q=70'
  },

  {
    id:10,
    n:'চিকেন রোল',
    c:'খাবার',
    p:150,
    i:'https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=500&q=80'
  },

  {
    id:11,
    n:'কোকা-কোলা 250ml',
    c:'খাবার',
    p:30,
    i:'https://images.pexels.com/photos/2668308/pexels-photo-2668308.jpeg'
  },

  {
    id:12,
    n:'পেপসি 250ml',
    c:'খাবার',
    p:30,
    i:'https://images.unsplash.com/photo-1629203851122-3726ecdf080e?auto=format&fit=crop&w=500&q=70'
  },

  {
    id:13,
    n:'স্প্রাইট 250ml',
    c:'খাবার',
    p:30,
    i:'https://images.pexels.com/photos/2668308/pexels-photo-2668308.jpeg'
  },

  {
    id:14,
    n:'মিনারেল পানি 500ml',
    c:'খাবার',
    p:20,
    i:'https://images.unsplash.com/photo-1629203851122-3726ecdf080e?auto=format&fit=crop&w=500&q=70'
  }

];

let P = JSON.parse(localStorage.getItem('es_products') || 'null');

if(!Array.isArray(P) || P.length === 0){
  P = [...starter];
}

let cart = JSON.parse(localStorage.getItem('es_cart') || '[]');

let orders = JSON.parse(localStorage.getItem('es_orders') || '[]');

let currentCat = 'সব';

function save(){

  localStorage.setItem(
    'es_products',
    JSON.stringify(P.slice(starter.length))
  );

  localStorage.setItem(
    'es_cart',
    JSON.stringify(cart)
  );

  localStorage.setItem(
    'es_orders',
    JSON.stringify(orders)
  );

}

function getEmoji(c){

  if(c === 'ফ্যাশন') return '👕';

  if(c === 'ইলেকট্রনিক্স') return '⌚';

  if(c === 'হোম') return '💡';

  if(c === 'খাবার') return '🍔';

  return '📦';

}

function card(x){

  const img = x.i && x.i.trim()
    ? `<img class="product-img"
         src="${x.i}"
         onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">`
    : '';

  return `

    <div class="card">

      ${img}

      <div
        class="fallback-img"
        style="${img ? 'display:none' : 'display:flex'}"
      >
        ${getEmoji(x.c)}
      </div>

      <div class="card-body">

        <h3>${x.n}</h3>

        <div class="category">
          ${x.c}
        </div>

        <div class="price">
          ৳${x.p}
        </div>

        <button
          class="primary"
          onclick="addCart(${x.id})"
        >
          কার্টে যোগ করুন
        </button>

      </div>

    </div>

  `;

}

function render(){

  const q =
    (document.getElementById('search')?.value || '')
      .trim()
      .toLowerCase();

  const list = P.filter(x => {

    const catOk =
      currentCat === 'সব' ||
      x.c === currentCat;

    const searchOk =
      !q ||
      x.n.toLowerCase().includes(q);

    return catOk && searchOk;

  });

  document.getElementById('products').innerHTML =
    list.length
      ? list.map(card).join('')
      : `<div class="empty">কোনো পণ্য পাওয়া যায়নি।</div>`;

  renderCart();
  renderSeller();
  renderAdmin();

  document.getElementById('cartCount').textContent =
    cart.reduce((sum,x)=>sum + Number(x.qty || 0),0);

}

function filterCat(cat){

  currentCat = cat;

  show('home');

}

function show(id){

  document
    .querySelectorAll('main section')
    .forEach(s => s.classList.add('hidden'));

  const el = document.getElementById(id);

  if(el){
    el.classList.remove('hidden');
  }

  render();

}

function addCart(id){

  const product = P.find(x => x.id === id);

  if(!product) return;

  const found = cart.find(x => x.id === id);

  if(found){

    found.qty++;

  }else{

    cart.push({
      id:id,
      qty:1
    });

  }

  save();
  render();

  alert('পণ্য কার্টে যোগ হয়েছে');

}

function removeCart(id){

  cart = cart.filter(x => x.id !== id);

  save();
  render();

}

function changeQty(id,change){

  const item = cart.find(x => x.id === id);

  if(!item) return;

  item.qty += change;

  if(item.qty <= 0){

    cart = cart.filter(x => x.id !== id);

  }

  save();
  render();

}

function renderCart(){

  const box =
    document.getElementById('cartList');

  const totalBox =
    document.getElementById('cartTotal');

  if(!box || !totalBox) return;

  let total = 0;

  const validCart = [];

  cart.forEach(c => {

    const p = P.find(x => x.id === c.id);

    if(!p) return;

    validCart.push(c);

    total += Number(p.p) * Number(c.qty);

  });

  if(validCart.length === 0){

    box.innerHTML =
      `<div class="box empty">
        আপনার কার্ট খালি।
      </div>`;

    totalBox.innerHTML = '';

    return;

  }

  cart = validCart;

  box.innerHTML = cart.map(c => {

    const p = P.find(x => x.id === c.id);

    return `

      <div class="box">

        <div class="item">

          <img
            src="${p.i || ''}"
            onerror="this.style.display='none'"
          >

          <div class="item-info">

            <b>${p.n}</b>

            <div>
              ৳${p.p}
            </div>

            <div class="qty">

              <button
                onclick="changeQty(${p.id},-1)"
              >
                −
              </button>

              <b>${c.qty}</b>

              <button
                onclick="changeQty(${p.id},1)"
              >
                +
              </button>

            </div>

          </div>

          <button
            class="danger"
            onclick="removeCart(${p.id})"
          >
            মুছুন
          </button>

        </div>

      </div>

    `;

  }).join('');

  totalBox.innerHTML = `

    <div class="box">

      <div class="total">
        মোট: ৳${total}
      </div>

      <button
        class="primary"
        onclick="checkout()"
      >
        অর্ডার করুন
      </button>

    </div>

  `;

}

function checkout(){

  if(cart.length === 0){

    alert('কার্ট খালি');

    return;

  }

  const name =
    prompt('আপনার নাম লিখুন');

  if(!name) return;

  const phone =
    prompt('মোবাইল নম্বর লিখুন');

  if(!phone) return;

  const address =
    prompt('ডেলিভারি ঠিকানা লিখুন');

  if(!address) return;

  const payment =
    prompt(
      'পেমেন্ট পদ্ধতি লিখুন:\n\n' +
      '1 = Cash on Delivery\n' +
      '2 = বিকাশ\n' +
      '3 = নগদ'
    ) || 'Cash on Delivery';

  let total = 0;

  const items = cart.map(c => {

    const p = P.find(x => x.id === c.id);

    total += Number(p.p) * Number(c.qty);

    return {
      id:p.id,
      n:p.n,
      p:p.p,
      qty:c.qty
    };

  });

  const order = {

    id:'ES' + Date.now(),

    name:name,

    phone:phone,

    address:address,

    payment:payment,

    items:items,

    total:total,

    status:'নতুন',

    date:new Date().toLocaleString('bn-BD')

  };

  orders.unshift(order);

  cart = [];

  save();

  alert(
    'অর্ডার সফল হয়েছে!\n\n' +
    'অর্ডার নম্বর: ' +
    order.id
  );

  show('orders');

}

function renderOrders(){

  const box =
    document.getElementById('ordersList');

  if(!box) return;

  if(orders.length === 0){

    box.innerHTML =
      `<div class="box empty">
        এখনো কোনো অর্ডার নেই।
      </div>`;

    return;

  }

  box.innerHTML = orders.map(o => `

    <div class="box">

      <div>
        <b>অর্ডার: ${o.id}</b>
      </div>

      <div>
        তারিখ: ${o.date}
      </div>

      <div>
        নাম: ${o.name}
      </div>

      <div>
        ফোন: ${o.phone}
      </div>

      <div>
        ঠিকানা: ${o.address}
      </div>

      <div>
        পেমেন্ট: ${o.payment}
      </div>

      <hr>

      ${o.items.map(i => `

        <div>
          ${i.n} × ${i.qty}
          = ৳${i.p * i.qty}
        </div>

      `).join('')}

      <hr>

      <div class="total">
        মোট: ৳${o.total}
      </div>

      <p>
        <span class="badge">
          ${o.status}
        </span>
      </p>

    </div>

  `).join('');

}

function addProduct(){

  const n =
    document.getElementById('pn').value.trim();

  const c =
    document.getElementById('pc').value;

  const p =
    Number(document.getElementById('pp').value);

  const i =
    document.getElementById('pi').value.trim();

  if(!n || !p){

    alert('পণ্যের নাম ও দাম দিন');

    return;

  }

  const newProduct = {

    id:Date.now(),

    n:n,

    c:c,

    p:p,

    i:i

  };

  P.push(newProduct);

  save();

  document.getElementById('pn').value='';
  document.getElementById('pp').value='';
  document.getElementById('pi').value='';

  render();

  alert('পণ্য যোগ হয়েছে');

}

function deleteProduct(id){

  if(!confirm('এই পণ্যটি মুছে ফেলবেন?')) return;

  P = P.filter(x => x.id !== id);

  cart = cart.filter(x => x.id !== id);

  save();

  render();

}

function renderSeller(){

  const box =
    document.getElementById('sellerProducts');

  if(!box) return;

  const custom =
    P.slice(starter.length);

  if(custom.length === 0){

    box.innerHTML =
      `<div class="empty">
        এখনো কোনো নতুন পণ্য যোগ করা হয়নি।
      </div>`;

    return;

  }

  box.innerHTML = custom.map(x => `

    <div class="item">

      <div class="item-info">

        <b>${x.n}</b>

        <div>
          ${x.c}
        </div>

        <div class="price">
          ৳${x.p}
        </div>

      </div>

      <button
        class="danger"
        onclick="deleteProduct(${x.id})"
      >
        মুছুন
      </button>

    </div>

  `).join('');

}

function renderAdmin(){

  const productBox =
    document.getElementById('adminProducts');

  const orderBox =
    document.getElementById('adminOrders');

  if(!productBox || !orderBox) return;

  productBox.innerHTML = P.map(x => `

    <div class="item">

      <div class="item-info">

        <b>${x.n}</b>

        <div>${x.c}</div>

        <div class="price">
          ৳${x.p}
        </div>

      </div>

    </div>

  `).join('');

  if(orders.length === 0){

    orderBox.innerHTML =
      `<div class="empty">
        এখনো কোনো অর্ডার নেই।
      </div>`;

    return;

  }

  orderBox.innerHTML = orders.map(o => `

    <div class="box">

      <b>${o.id}</b>

      <p>
        ${o.name} — ${o.phone}
      </p>

      <p>
        মোট: <b>৳${o.total}</b>
      </p>

      <select
        onchange="updateOrderStatus('${o.id}',this.value)"
      >

        <option ${o.status==='নতুন'?'selected':''}>
          নতুন
        </option>

        <option ${o.status==='প্রস্তুত হচ্ছে'?'selected':''}>
          প্রস্তুত হচ্ছে
        </option>

        <option ${o.status==='ডেলিভারিতে'?'selected':''}>
          ডেলিভারিতে
        </option>

        <option ${o.status==='সম্পন্ন'?'selected':''}>
          সম্পন্ন
        </option>

        <option ${o.status==='বাতিল'?'selected':''}>
          বাতিল
        </option>

      </select>

    </div>

  `).join('');

}

function updateOrderStatus(id,status){

  const o =
    orders.find(x => x.id === id);

  if(!o) return;

  o.status = status;

  save();

  render();

}

function saveProfile(){

  const name =
    document.getElementById('profileName').value.trim();

  const phone =
    document.getElementById('profilePhone').value.trim();

  const address =
    document.getElementById('profileAddress').value.trim();

  localStorage.setItem(
    'es_profile',
    JSON.stringify({
      name:name,
      phone:phone,
      address:address
    })
  );

  alert('প্রোফাইল সেভ হয়েছে');

}

function loadProfile(){

  const p =
    JSON.parse(
      localStorage.getItem('es_profile') || 'null'
    );

  if(!p) return;

  document.getElementById('profileName').value =
    p.name || '';

  document.getElementById('profilePhone').value =
    p.phone || '';

  document.getElementById('profileAddress').value =
    p.address || '';

}

function load(){

  loadProfile();

  render();

  renderOrders();

}

document.addEventListener(
  'DOMContentLoaded',
  load
);

</script>

</body>
</html>
