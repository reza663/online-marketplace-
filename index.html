<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>একসাথে — Smart Shopping App</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#f4f7f5;
  color:#17352b;
}

header{
  position:sticky;
  top:0;
  z-index:50;
  background:#087f5b;
  color:white;
  padding:12px 14px;
  box-shadow:0 2px 10px #0002;
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.logo{
  font-size:23px;
  font-weight:800;
}

.header-actions{
  display:flex;
  gap:7px;
  align-items:center;
}

.hbtn{
  border:0;
  background:white;
  color:#087f5b;
  border-radius:20px;
  padding:7px 11px;
  font-weight:bold;
}

.search{
  margin-top:10px;
}

.search input{
  width:100%;
  padding:12px 14px;
  border:0;
  border-radius:12px;
  outline:none;
  font-size:15px;
}

nav{
  position:sticky;
  top:112px;
  z-index:40;
  background:white;
  display:flex;
  overflow:auto;
  gap:8px;
  padding:9px;
  border-bottom:1px solid #ddd;
}

nav button{
  border:1px solid #cfe4da;
  background:#fff;
  color:#176047;
  padding:8px 13px;
  border-radius:20px;
  white-space:nowrap;
}

nav button.active{
  background:#087f5b;
  color:white;
}

main{
  padding:14px;
  max-width:1000px;
  margin:auto;
}

.page-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.page-title h2{
  margin:0;
  font-size:21px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.card{
  background:white;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 3px 12px #00000012;
}

.product-img{
  width:100%;
  height:175px;
  object-fit:contain;
  background:#f7faf8;
  display:block;
}

.card-body{
  padding:11px;
}

.card h3{
  margin:0 0 5px;
  font-size:16px;
}

.cat{
  font-size:12px;
  color:#6b7d76;
  margin-bottom:6px;
}

.price{
  color:#087f5b;
  font-size:18px;
  font-weight:800;
}

.card-actions{
  display:flex;
  gap:6px;
  margin-top:9px;
}

button{
  cursor:pointer;
}

.primary{
  background:#087f5b;
  color:white;
  border:0;
  border-radius:9px;
  padding:9px 12px;
  font-weight:bold;
}

.secondary{
  background:#e9f5f0;
  color:#087f5b;
  border:0;
  border-radius:9px;
  padding:9px 12px;
  font-weight:bold;
}

.danger{
  background:#ffe9e9;
  color:#b42318;
  border:0;
  border-radius:9px;
  padding:8px 11px;
  font-weight:bold;
}

.full{
  width:100%;
}

.section{
  background:white;
  padding:14px;
  border-radius:15px;
  margin-bottom:13px;
  box-shadow:0 2px 10px #0000000d;
}

.section h3{
  margin-top:0;
}

input,select,textarea{
  width:100%;
  padding:11px;
  border:1px solid #ccd9d3;
  border-radius:9px;
  margin:5px 0 9px;
  font-size:15px;
  outline:none;
}

textarea{
  min-height:80px;
  resize:vertical;
}

.product-row,
.order-row{
  border:1px solid #e0e8e4;
  border-radius:12px;
  padding:11px;
  margin-bottom:9px;
  background:#fbfdfc;
}

.row-flex{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.small{
  font-size:12px;
  color:#6b7d76;
}

.qty{
  display:flex;
  align-items:center;
  gap:9px;
}

.qty button{
  width:32px;
  height:32px;
  border:0;
  border-radius:8px;
  background:#e7f4ee;
  color:#087f5b;
  font-size:18px;
  font-weight:bold;
}

.empty{
  text-align:center;
  padding:35px 10px;
  color:#71817b;
}

.profile-icon{
  font-size:48px;
  text-align:center;
  margin-bottom:5px;
}

.stat-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
}

.stat{
  background:#eaf6f1;
  border-radius:12px;
  padding:14px;
  text-align:center;
}

.stat b{
  display:block;
  font-size:22px;
  color:#087f5b;
}

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  background:white;
  border-top:1px solid #ddd;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  z-index:60;
}

.bottom button{
  border:0;
  background:white;
  padding:8px 2px;
  color:#52645d;
  font-size:11px;
}

.bottom button.active{
  color:#087f5b;
  font-weight:bold;
}

.bottom span{
  display:block;
  font-size:20px;
}

footer{
  padding:20px 10px 90px;
  text-align:center;
  color:#71817b;
  font-size:11px;
}

.lang{
  font-size:12px;
}

.badge{
  display:inline-block;
  background:#e8f6f0;
  color:#087f5b;
  border-radius:20px;
  padding:5px 9px;
  font-size:12px;
  font-weight:bold;
}

.payment-box{
  background:#f1faf6;
  border:1px solid #cce9dc;
  border-radius:12px;
  padding:12px;
  margin-top:8px;
}

@media(min-width:700px){
  .grid{
    grid-template-columns:repeat(4,1fr);
  }
  .product-img{
    height:190px;
  }
}

@media(max-width:360px){
  .grid{
    gap:8px;
  }
  .product-img{
    height:145px;
  }
}
</style>
</head>

<body>

<header>
  <div class="top">
    <div class="logo">🛍️ একসাথে</div>

    <div class="header-actions">
      <button class="hbtn" onclick="toggleLang()" id="langBtn">বাংলা</button>
      <button class="hbtn" onclick="go('cart')">🛒 <span id="cartCount">0</span></button>
    </div>
  </div>

  <div class="search">
    <input id="searchInput"
      placeholder="পণ্য খুঁজুন..."
      oninput="renderHome()">
  </div>
</header>

<nav id="categories"></nav>

<main id="app"></main>

<footer>
  একসাথে — আপনার সহজ অনলাইন শপিং প্ল্যাটফর্ম<br>
  Product photo sources: Wikimedia Commons
</footer>

<div class="bottom">
  <button id="nav-home" onclick="go('home')">
    <span>🏠</span>হোম
  </button>

  <button id="nav-shop" onclick="go('shop')">
    <span>🛍️</span>শপ
  </button>

  <button id="nav-cart" onclick="go('cart')">
    <span>🛒</span>কার্ট
  </button>

  <button id="nav-orders" onclick="go('orders')">
    <span>📦</span>অর্ডার
  </button>

  <button id="nav-profile" onclick="go('profile')">
    <span>👤</span>প্রোফাইল
  </button>
</div>

<script>

/* =====================================================
   EKSHATHE FINAL VERSION
   ===================================================== */

const STORE = "ekshathe_final_v3";

const PAYMENT = {
  bkash:"01758310379",
  nagad:"01758310379",
  rocket:"01850252566"
};

/* REAL PRODUCT PHOTOS */

const REAL_IMAGES = {
  coke:"https://upload.wikimedia.org/wikipedia/commons/8/84/Bengali_Coca-Cola_can.jpg",
  sprite:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Sprite%20bottle.JPG",
  water:"https://commons.wikimedia.org/wiki/Special:Redirect/file/A_bottle_of_Aqua_mineral_water.JPG"
};

/* 12 DEFAULT PRODUCTS */

const starter = [

 {
  id:1,
  n:"পুরুষের শার্ট",
  en:"Men's Shirt",
  c:"ফ্যাশন",
  ce:"Fashion",
  p:850,
  i:"https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?auto=format&fit=crop&w=700&q=80"
 },

 {
  id:2,
  n:"মহিলাদের ড্রেস",
  en:"Women's Dress",
  c:"ফ্যাশন",
  ce:"Fashion",
  p:1250,
  i:"https://images.unsplash.com/photo-1595777457583-95e059d581b8?auto=format&fit=crop&w=700&q=80"
 },

 {
  id:3,
  n:"স্মার্ট ওয়াচ",
  en:"Smart Watch",
  c:"ইলেকট্রনিক্স",
  ce:"Electronics",
  p:3000,
  i:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=700&q=80"
 },

 {
  id:4,
  n:"ব্যাকপ্যাক",
  en:"Backpack",
  c:"ফ্যাশন",
  ce:"Fashion",
  p:900,
  i:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=700&q=80"
 },

 {
  id:5,
  n:"টেবিল ল্যাম্প",
  en:"Table Lamp",
  c:"হোম",
  ce:"Home",
  p:700,
  i:"https://images.unsplash.com/photo-1507473885765-e6ed057f782c?auto=format&fit=crop&w=700&q=80"
 },

 {
  id:6,
  n:"স্পোর্টস জুতা",
  en:"Sports Shoes",
  c:"ফ্যাশন",
  ce:"Fashion",
  p:1300,
  i:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=700&q=80"
 },

 {
  id:7,
  n:"কাচ্চি বিরিয়ানি",
  en:"Kacchi Biryani",
  c:"খাবার",
  ce:"Food",
  p:300,
  i:"https://images.unsplash.com/photo-1563379091339-03246963d96c?auto=format&fit=crop&w=700&q=80"
 },

 {
  id:8,
  n:"চিকেন বার্গার",
  en:"Chicken Burger",
  c:"খাবার",
  ce:"Food",
  p:180,
  i:"https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=700&q=80"
 },

 {
  id:9,
  n:"পিজ্জা",
  en:"Pizza",
  c:"খাবার",
  ce:"Food",
  p:280,
  i:"https://images.unsplash.com/photo-1574071318508-1cdbab80d002?auto=format&fit=crop&w=700&q=80"
 },

 {
  id:10,
  n:"Coca-Cola 250ml",
  en:"Coca-Cola 250ml",
  c:"সফট ড্রিংকস",
  ce:"Soft Drinks",
  p:30,
  i:REAL_IMAGES.coke
 },

 {
  id:11,
  n:"Sprite 250ml",
  en:"Sprite 250ml",
  c:"সফট ড্রিংকস",
  ce:"Soft Drinks",
  p:30,
  i:REAL_IMAGES.sprite
 },

 {
  id:12,
  n:"মিনারেল পানি 500ml",
  en:"Mineral Water 500ml",
  c:"পানীয়",
  ce:"Beverages",
  p:20,
  i:REAL_IMAGES.water
 }

];

/* LOAD DATA */

let P = JSON.parse(localStorage.getItem(STORE+"_products") || "null");

if(!Array.isArray(P) || P.length===0){
  P = JSON.parse(JSON.stringify(starter));
}

let CART = JSON.parse(localStorage.getItem(STORE+"_cart") || "{}");

let ORDERS = JSON.parse(localStorage.getItem(STORE+"_orders") || "[]");

let PROFILE = JSON.parse(localStorage.getItem(STORE+"_profile") || "{}");

let currentPage = "home";
let currentCategory = "সব";
let lang = localStorage.getItem(STORE+"_lang") || "bn";

/* SAVE */

function saveAll(){

  localStorage.setItem(STORE+"_products",JSON.stringify(P));

  localStorage.setItem(STORE+"_cart",JSON.stringify(CART));

  localStorage.setItem(STORE+"_orders",JSON.stringify(ORDERS));

  localStorage.setItem(STORE+"_profile",JSON.stringify(PROFILE));

  localStorage.setItem(STORE+"_lang",lang);

}

/* LANGUAGE */

function toggleLang(){

  lang = lang==="bn" ? "en" : "bn";

  saveAll();

  renderAll();

}

function T(bn,en){
  return lang==="bn" ? bn : en;
}

/* NAVIGATION */

function go(page){

  currentPage = page;

  renderAll();

  window.scrollTo({top:0,behavior:"smooth"});

}

/* CATEGORIES */

function renderCategories(){

  const cats = [
    ["সব","All"],
    ["ফ্যাশন","Fashion"],
    ["ইলেকট্রনিক্স","Electronics"],
    ["হোম","Home"],
    ["খাবার","Food"],
    ["সফট ড্রিংকস","Soft Drinks"],
    ["পানীয়","Beverages"]
  ];

  document.getElementById("categories").innerHTML =
    cats.map(x=>`
      <button
        class="${currentCategory===x[0]?'active':''}"
        onclick="setCategory('${x[0]}')">
        ${lang==="bn"?x[0]:x[1]}
      </button>
    `).join("");

}

function setCategory(c){

  currentCategory = c;

  currentPage = "shop";

  renderAll();

}

/* PRODUCT NAME */

function productName(x){

  return lang==="bn" ? x.n : x.en;

}

/* HOME / SHOP */

function renderHome(){

  const q = (document.getElementById("searchInput")?.value || "")
    .toLowerCase()
    .trim();

  let list = P.filter(x=>{

    const matchCat =
      currentCategory==="সব" ||
      x.c===currentCategory ||
      (lang==="en" && x.ce===currentCategory);

    const text =
      (x.n+" "+x.en+" "+x.c+" "+x.ce).toLowerCase();

    const matchSearch =
      !q || text.includes(q);

    return matchCat && matchSearch;

  });

  let title =
    currentPage==="home"
    ? T("জনপ্রিয় পণ্য","Popular Products")
    : T("সব পণ্য","All Products");

  if(currentCategory!=="সব"){
    title = lang==="bn"
      ? currentCategory
      : (list[0]?.ce || currentCategory);
  }

  document.getElementById("app").innerHTML = `

    <div class="page-title">
      <h2>${title}</h2>
      <span class="badge">${list.length} ${T("টি","items")}</span>
    </div>

    ${
      list.length
      ?
      `<div class="grid">
        ${list.map(card).join("")}
      </div>`
      :
      `<div class="empty">
        😔<br><br>
        ${T("কোনো পণ্য পাওয়া যায়নি","No products found")}
      </div>`
    }

  `;

}

function card(x){

  return `
    <div class="card">

      <img
        class="product-img"
        src="${x.i}"
        alt="${productName(x)}"
        onerror="this.onerror=null;this.src='https://via.placeholder.com/500x400?text=Product+Image';"
      >

      <div class="card-body">

        <h3>${productName(x)}</h3>

        <div class="cat">
          ${lang==="bn"?x.c:x.ce}
        </div>

        <div class="price">
          ৳${Number(x.p).toLocaleString("en-BD")}
        </div>

        <div class="card-actions">

          <button
            class="primary"
            onclick="addCart(${x.id})">
            🛒 ${T("কার্টে যোগ","Add")}
          </button>

          <button
            class="secondary"
            onclick="buyNow(${x.id})">
            ${T("কিনুন","Buy")}
          </button>

        </div>

      </div>
    </div>
  `;

}

/* CART */

function addCart(id){

  CART[id] = (CART[id] || 0) + 1;

  saveAll();

  updateCartCount();

  alert(T("কার্টে যোগ হয়েছে","Added to cart"));

}

function buyNow(id){

  CART[id] = (CART[id] || 0) + 1;

  saveAll();

  go("cart");

}

function cartItems(){

  return Object.keys(CART)
    .map(id=>{

      const p = P.find(x=>x.id==id);

      if(!p) return null;

      return {
        p:p,
        q:CART[id]
      };

    })
    .filter(Boolean);

}

function changeQty(id,n){

  CART[id] = (CART[id] || 0) + n;

  if(CART[id]<=0){
    delete CART[id];
  }

  saveAll();

  renderCart();

  updateCartCount();

}

function removeCart(id){

  delete CART[id];

  saveAll();

  renderCart();

  updateCartCount();

}

function cartTotal(){

  return cartItems().reduce(
    (s,x)=>s+(Number(x.p.p)||0)*x.q,
    0
  );

}

function renderCart(){

  const items = cartItems();

  document.getElementById("app").innerHTML = `

    <div class="page-title">
      <h2>🛒 ${T("আমার কার্ট","My Cart")}</h2>
      <span class="badge">${items.length}</span>
    </div>

    ${
      items.length
      ?
      `
      ${items.map(x=>`

        <div class="product-row">

          <div class="row-flex">

            <div style="display:flex;gap:10px;align-items:center">

              <img
                src="${x.p.i}"
                style="width:65px;height:65px;object-fit:contain;border-radius:8px;background:#f5f8f6"
                onerror="this.src='https://via.placeholder.com/100x100?text=Image'"
              >

              <div>
                <b>${productName(x.p)}</b>
                <div class="small">
                  ৳${Number(x.p.p).toLocaleString("en-BD")}
                </div>
              </div>

            </div>

            <button
              class="danger"
              onclick="removeCart(${x.p.id})">
              ✕
            </button>

          </div>

          <div class="row-flex" style="margin-top:10px">

            <div class="qty">
              <button onclick="changeQty(${x.p.id},-1)">−</button>
              <b>${x.q}</b>
              <button onclick="changeQty(${x.p.id},1)">+</button>
            </div>

            <b>
              ৳${(x.p.p*x.q).toLocaleString("en-BD")}
            </b>

          </div>

        </div>

      `).join("")}

      <div class="section">

        <div class="row-flex">
          <b>${T("মোট","Total")}</b>
          <b class="price">
            ৳${cartTotal().toLocaleString("en-BD")}
          </b>
        </div>

        <button
          class="primary full"
          style="margin-top:12px"
          onclick="checkout()">
          ${T("অর্ডার করুন","Place Order")}
        </button>

      </div>
      `
      :
      `
      <div class="empty">
        🛒<br><br>
        ${T("আপনার কার্ট খালি","Your cart is empty")}
        <br><br>
        <button class="primary" onclick="go('shop')">
          ${T("শপিং শুরু করুন","Start Shopping")}
        </button>
      </div>
      `
    }

  `;

}

/* CHECKOUT */

function checkout(){

  const items = cartItems();

  if(!items.length){
    alert(T("কার্ট খালি","Cart is empty"));
    return;
  }

  document.getElementById("app").innerHTML = `

    <div class="page-title">
      <h2>🧾 ${T("অর্ডার তথ্য","Order Information")}</h2>
    </div>

    <div class="section">

      <label>${T("নাম","Name")}</label>
      <input id="cName" value="${PROFILE.name||""}" placeholder="${T("আপনার নাম","Your name")}">

      <label>${T("মোবাইল নম্বর","Mobile Number")}</label>
      <input id="cPhone" value="${PROFILE.phone||""}" placeholder="01XXXXXXXXX">

      <label>${T("ঠিকানা","Address")}</label>
      <textarea id="cAddress" placeholder="${T("ডেলিভারি ঠিকানা","Delivery address")}">${PROFILE.address||""}</textarea>

      <label>${T("পেমেন্ট পদ্ধতি","Payment Method")}</label>

      <select id="payment" onchange="showPaymentNumber()">
        <option value="cod">${T("Cash on Delivery","Cash on Delivery")}</option>
        <option value="bkash">bKash</option>
        <option value="nagad">Nagad</option>
        <option value="rocket">Rocket</option>
      </select>

      <div id="paymentNumber"></div>

      <label>${T("Transaction ID (যদি থাকে)","Transaction ID (if applicable)")}</label>

      <input
        id="trx"
        placeholder="${T("Transaction ID","Transaction ID")}">

      <div class="payment-box">
        <b>${T("অর্ডার মোট","Order Total")}</b>
        <div class="price">
          ৳${cartTotal().toLocaleString("en-BD")}
        </div>
      </div>

      <button
        class="primary full"
        style="margin-top:12px"
        onclick="placeOrder()">
        ✅ ${T("অর্ডার কনফার্ম করুন","Confirm Order")}
      </button>

    </div>
  `;

  showPaymentNumber();

}

function showPaymentNumber(){

  const method = document.getElementById("payment")?.value;

  const box = document.getElementById("paymentNumber");

  if(!box) return;

  if(method==="bkash"){

    box.innerHTML = `
      <div class="payment-box">
        <b>bKash</b><br>
        ${PAYMENT.bkash}
      </div>
    `;

  }
  else if(method==="nagad"){

    box.innerHTML = `
      <div class="payment-box">
        <b>Nagad</b><br>
        ${PAYMENT.nagad}
      </div>
    `;

  }
  else if(method==="rocket"){

    box.innerHTML = `
      <div class="payment-box">
        <b>Rocket</b><br>
        ${PAYMENT.rocket}
      </div>
    `;

  }
  else{

    box.innerHTML = `
      <div class="payment-box">
        ${T("Cash on Delivery — পণ্য হাতে পেয়ে পেমেন্ট করবেন।","Cash on Delivery — Pay when you receive the product.")}
      </div>
    `;

  }

}

function placeOrder(){

  const name =
    document.getElementById("cName").value.trim();

  const phone =
    document.getElementById("cPhone").value.trim();

  const address =
    document.getElementById("cAddress").value.trim();

  const payment =
    document.getElementById("payment").value;

  const trx =
    document.getElementById("trx").value.trim();

  if(!name || !phone || !address){

    alert(T(
      "নাম, মোবাইল ও ঠিকানা দিন।",
      "Please enter name, mobile and address."
    ));

    return;
  }

  PROFILE = {
    name:name,
    phone:phone,
    address:address
  };

  const order = {

    id:"ES"+Date.now(),

    date:new Date().toLocaleString("bn-BD"),

    name:name,

    phone:phone,

    address:address,

    payment:payment,

    trx:trx,

    items:cartItems().map(x=>({

      id:x.p.id,

      name:x.p.n,

      en:x.p.en,

      price:x.p.p,

      qty:x.q,

      image:x.p.i

    })),

    total:cartTotal(),

    status:"Pending"

  };

  ORDERS.unshift(order);

  CART = {};

  saveAll();

  updateCartCount();

  alert(T(
    "অর্ডার সফল হয়েছে!",
    "Order placed successfully!"
  ));

  go("orders");

}

/* SELLER */

function renderSeller(){

  document.getElementById("app").innerHTML = `

    <div class="page-title">
      <h2>🏪 ${T("Seller Panel","Seller Panel")}</h2>
    </div>

    <div class="section">

      <h3>${T("নতুন পণ্য যোগ করুন","Add New Product")}</h3>

      <input
        id="sn"
        placeholder="${T("পণ্যের নাম","Product name")}">

      <select id="sc">
        <option>ফ্যাশন</option>
        <option>ইলেকট্রনিক্স</option>
        <option>হোম</option>

      </button>

    </div>

    <div class="section">

      <h3>${T("আমার পণ্য","My Products")}</h3>

      ${P.map(x=>`

        <div class="product-row">

          <div class="row-flex">

            <div>
              <b>${productName(x)}</b>

              <div class="small">
                ${x.c}
              </div>

            </div>

            <b class="price">
              ৳${x.p}
            </b>

          </div>

          <div style="display:flex;gap:7px;margin-top:9px">

            <button
              class="secondary"
              onclick="changePrice(${x.id},10)">
              +10
            </button>

            <button
              class="secondary"
              onclick="changePrice(${x.id},-10)">
              -10
            </button>

            <button
              class="danger"
              onclick="deleteProduct(${x.id})">
              ${T("ডিলিট","Delete")}
            </button>

          </div>

        </div>

      `).join("")}

    </div>

  `;

}

function sellerAdd(){

  const n = document.getElementById("sn").value.trim();

  const c = document.getElementById("sc").value;

  const p = Number(document.getElementById("sp").value);

  const i = document.getElementById("si").value.trim();

  if(!n || !p){

    alert(T(
      "পণ্যের নাম ও দাম দিন।",
      "Enter product name and price."
    ));

    return;
  }

  P.push({

    id:Date.now(),

    n:n,

    en:n,

    c:c,

    ce:c,

    p:p,

    i:i || "https://via.placeholder.com/500x400?text=Product"

  });

  saveAll();

  alert(T(
    "পণ্য যোগ হয়েছে।",
    "Product added."
  ));

  renderSeller();

}

function changePrice(id,amount){

  const p = P.find(x=>x.id===id);

  if(!p) return;

  p.p = Math.max(0,Number(p.p)+amount);

  saveAll();

  renderAll();

}

function deleteProduct(id){

  if(!confirm(T(
    "পণ্যটি মুছে ফেলবেন?",
    "Delete this product?"
  ))) return;

  P = P.filter(x=>x.id!==id);

  delete CART[id];

  saveAll();

  renderSeller();

  updateCartCount();

}

      </div>

      <div class="stat">
        <b>৳${sales.toLocaleString("en-BD")}</b>
        ${T("মোট বিক্রি","Sales")}
      </div>

      <div class="stat">
        <b>৳${commission.toLocaleString("en-BD")}</b>

            <div>

              <button

              </button>

              <b>৳${x.p}</b>

      `).join("")}

    </div>

    <div class="section">

                  Confirmed

                  Processing
                </option>

                <option ${o.status==="Delivered"?"selected":""}>
                  Delivered
                </option>

                <option ${o.status==="Cancelled"?"selected":""}>
                  Cancelled
                </option>

              </select>

            </div>

            <div class="small">
              ${o.name} — ${o.phone}
            </div>

            <div style="margin-top:5px">

        `).join("")
        :
        `<div class="empty">
          ${T("কোনো অর্ডার নেই","No orders")}

function adminPrice(id,amount){

  const p = P.find(x=>x.id===id);

  if(!p) return;

  p.p = Math.max(0,Number(p.p)+amount);

  saveAll();

  renderAdmin();

}

function savePayment(){

  PAYMENT.bkash =
    document.getElementById("bk").value.trim();

  PAYMENT.nagad =
    document.getElementById("ng").value.trim();

  PAYMENT.rocket =
    document.getElementById("rk").value.trim();

  /*
    Payment values are intentionally stored
    separately so the numbers remain editable.
  */

  localStorage.setItem(
    STORE+"_payment",
    JSON.stringify(PAYMENT)
  );

  alert(T(
    "পেমেন্ট নম্বর সেভ হয়েছে।",
    "Payment numbers saved."
  ));

}

function changeOrderStatus(id,status){

  const o = ORDERS.find(x=>x.id===id);

  if(!o) return;

  o.status = status;

  saveAll();

  renderAdmin();

}

/* LOAD PAYMENT */

const savedPayment =
  JSON.parse(localStorage.getItem(STORE+"_payment") || "null");

if(savedPayment){

  PAYMENT.bkash = savedPayment.bkash || PAYMENT.bkash;
  PAYMENT.nagad = savedPayment.nagad || PAYMENT.nagad;
  PAYMENT.rocket = savedPayment.rocket || PAYMENT.rocket;

}

/* CART COUNT */

function updateCartCount(){

  const count =
    Object.values(CART).reduce(
      (a,b)=>a+Number(b),
      0
    );

  document.getElementById("cartCount").textContent=count;

}

/* PAGE RENDER */

function renderAll(){

  renderCategories();

  document.getElementById("langBtn").textContent =
    lang==="bn" ? "বাংলা" : "English";

  document.querySelectorAll(".bottom button")
    .forEach(b=>b.classList.remove("active"));

  const nav =
    document.getElementById("nav-"+currentPage);

  if(nav) nav.classList.add("active");

  if(currentPage==="home"){
    renderHome();
  }
  else if(currentPage==="shop"){
    renderHome();
  }
  else if(currentPage==="cart"){
    renderCart();
  }
  else if(currentPage==="orders"){
    renderOrders();
  }
  else if(currentPage==="profile"){
    renderProfile();
  }
  else if(currentPage==="seller"){
    renderSeller();
  }
  else if(currentPage==="admin"){
    renderAdmin();
  }

  updateCartCount();

}

/* START */

renderAll();

</script>
