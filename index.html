function productImage(p){

 const url=REAL_IMAGES[p.name];

 if(!url){
  return "";
 }

 return url;
}


/* =========================================================
   IMAGE ERROR
   ভুল অন্য ছবি নয়
========================================================= */

function imageTag(p){

 const url=productImage(p);

 if(!url){
  return `
   <div class="product-img"
        style="display:flex;align-items:center;justify-content:center">
    ছবি পাওয়া যায়নি
   </div>
  `;
 }

 return `
  <img
   class="product-img"
   src="${url}"
   alt="${p.name}"
   loading="lazy"
   onerror="this.style.display='none';
   this.nextElementSibling.style.display='flex'">
  <div class="product-img"
       style="display:none;align-items:center;justify-content:center;color:#777">
    এই পণ্যের ছবি লোড হয়নি
  </div>
 `;
}

function filteredProducts(){

  .trim()
  .toLowerCase();

 return products.filter(p=>{

  const categoryOK=
   currentCategory==="সব"||
   p.cat===currentCategory;

  const text=
   (p.name+" "+p.en+" "+p.cat)
   .toLowerCase();

  return categoryOK &&
   (!q||text.includes(q));
 });
}
