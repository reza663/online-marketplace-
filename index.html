/* =====================================================
   IMAGE FALLBACK
===================================================== */

function imageHTML(p,cls="product-img"){

 const url=IMAGES[p.id];

 if(!url){
  return fallbackImage(p);
 }

 return `
 <img
   class="${cls}"
   src="${url}"
   alt="${p.en}"
   loading="lazy"
   onerror="imageFailed(this,${p.id})">
 `;
}

function imageFailed(img,id){

 const p=products.find(x=>x.id===id);

 const box=document.createElement("div");
 box.className="image-fallback";
 box.innerHTML=`
  <div class="big">🛍️</div>
  <b>${p?p.name:"পণ্যের ছবি"}</b>
  <small>ছবিটি লোড হয়নি</small>
 `;

 img.replaceWith(box);
}

function fallbackImage(p){

 return `
 <div class="image-fallback">
  <div class="big">🛍️</div>
  <b>${p.name}</b>
  <small>ছবি পাওয়া যায়নি</small>
 </div>
 `;
}

/* =====================================================
   CART
===================================================== */

function addToCart(productId,variantIndex){

 const found=cart.find(
  x=>x.productId===productId &&
     x.variantIndex===variantIndex
 );

 if(found){
  found.qty++;
 }else{
  cart.push({
   productId,
   variantIndex,
   qty:1
  });
 }

 saveCart();
}

function quickAdd(id){

 const p=products.find(x=>x.id===id);

 if(!p)return;

 addToCart(id,0);

 updateCartCount();

 alert(
  language==="bn"
  ?`${p.name} কার্টে যোগ হয়েছে।`
  :`${p.en} added to cart.`
 );
}

function saveCart(){

 localStorage.setItem(
  "ekshathe_cart",
  JSON.stringify(cart)
 );

 updateCartCount();
}

function updateCartCount(){

 const count=cart.reduce(
  (sum,x)=>sum+x.qty,0
 );

 document.getElementById("cartCount").textContent=count;
}

function cartDetails(){

 return cart.map(item=>{

  const p=products.find(x=>x.id===item.productId);

  if(!p)return null;

  const v=p.variants[item.variantIndex];

  if(!v)return null;

  return{
   ...item,
   product:p,
   variant:v[0],
   price:v[1],
   total:v[1]*item.qty
  };

 }).filter(Boolean);
}

function changeQty(index,delta){

 if(!cart[index])return;

 cart[index].qty+=delta;

 if(cart[index].qty<=0){
  cart.splice(index,1);
 }

 saveCart();
 renderCart();
}

function removeCart(index){

 cart.splice(index,1);
 saveCart();
 renderCart();
}

function cartTotal(){

 return cartDetails().reduce(
  (sum,x)=>sum+x.total,0
 );
}

function placeOrder(){

 const name=document.getElementById("checkoutName")?.value.trim();
 const phone=document.getElementById("checkoutPhone")?.value.trim();
 const address=document.getElementById("checkoutAddress")?.value.trim();
 const method=document.getElementById("paymentMethod")?.value;

 if(!name||!phone||!address){

  alert(
   language==="bn"
   ?"নাম, মোবাইল ও ঠিকানা পূরণ করুন।"
   :"Please fill name, phone and address."
  );

  return;
 }

 let transactionId="";

 if(method!=="cod"){

  transactionId=
   document.getElementById("transactionId")?.value.trim()||"";

  if(!transactionId){

   alert(
    language==="bn"
    ?"Transaction ID দিন।"
    :"Please enter Transaction ID."
   );

   return;
  }
 }

 profile={
  name,
  phone,
  address
 };

 localStorage.setItem(
  "ekshathe_profile",
  JSON.stringify(profile)
 );

 const order={

  id:"ES"+Date.now(),

  date:new Date().toLocaleString("bn-BD"),

  customer:{
   name,
   phone,
   address
  },

  payment:{
   method,
   transactionId
  },

  items:cartDetails().map(x=>({
   productId:x.productId,
   name:x.product.name,
   variant:x.variant,
   price:x.price,
   qty:x.qty,
   total:x.total
  })),

  total:cartTotal(),

  status:"নতুন"
 };

 orders.unshift(order);

 localStorage.setItem(
  "ekshathe_orders",
  JSON.stringify(orders)
 );

 cart=[];

 saveCart();

 alert(
  language==="bn"
  ?"অর্ডার সফলভাবে নেওয়া হয়েছে।"
  :"Order placed successfully."
 );

 showPage("orders");
}

    </div>

   `).join("")
   :
   `<div class="empty">কোনো অর্ডার নেই</div>`
  }

 </div>

 <button
  class="secondary full"
  onclick="showPage('profile')">
  ← Profile
 </button>
 `;
}

function changeOrderStatus(index,status){

 if(!orders[index])return;

 orders[index].status=status;

 localStorage.setItem(
  "ekshathe_orders",
  JSON.stringify(orders)
 );

 adminPanel();
}


/* =====================================================
   NAVIGATION
===================================================== */

function updateNav(){

 const ids=[
  "navHome",
  "navShop",
  "navCart",
  "navOrders",
  "navProfile"
 ];

 ids.forEach(id=>{
  document.getElementById(id)?.classList.remove("active");
 });

 const map={
  home:"navHome",
  shop:"navShop",
  cart:"navCart",
  checkout:"navCart",
  orders:"navOrders",
  profile:"navProfile"
 };

 document.getElementById(
  map[currentPage]
 )?.classList.add("active");
}

function showPage(page){

 currentPage=page;

 renderCategories();

 if(page==="home"){
  renderHome();
 }
 else if(page==="shop"){
  renderProducts();
 }
 else if(page==="cart"){
  renderCart();
 }
 else if(page==="checkout"){
  renderCheckout();
 }
 else if(page==="orders"){
  renderOrders();
 }
 else if(page==="profile"){
  renderProfile();
 }

 updateNav();

 window.scrollTo(0,0);
}


/* =====================================================
   START APP
===================================================== */

renderCategories();
updateCartCount();
showPage("home");

</script>
